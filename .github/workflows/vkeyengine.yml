name: VKeyEngine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: VKeyEngine-windows-x64
          path: target/release/VKeyEngine.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --release -- -D warnings
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: ./build-macos.sh --universal
      - run: ditto -c -k --keepParent target/VKeyEngine.app target/VKeyEngine-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: VKeyEngine-macos
          path: target/VKeyEngine-macos.zip
