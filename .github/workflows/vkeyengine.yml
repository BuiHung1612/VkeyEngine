name: VKeyEngine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: VKeyEngine-windows-x64
          path: target/release/VKeyEngine.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --release -- -D warnings
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: ./build-macos.sh --universal
      - run: ditto -c -k --keepParent target/VKeyEngine.app target/VKeyEngine-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: VKeyEngine-macos
          path: target/VKeyEngine-macos.zip

  # Push a tag like v1.0.1 to publish a GitHub Release with both builds.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: mv dist/VKeyEngine.exe dist/VKeyEngine-windows-x64.exe
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "VKeyEngine $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
